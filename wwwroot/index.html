<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Adoption System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="/css/site.css">

    <style>
        body {
            background-color: #f8f5f0 !important;
            font-family: "Microsoft JhengHei", sans-serif !important;
        }

        .hero {
            background-color: #fffaf3 !important;
            padding: 80px 30px;
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(95, 70, 51, 0.12);
            margin-top: 60px;
            text-align: center;
        }

            .hero img {
                width: 180px;
                height: 180px;
                object-fit: contain;
                margin-bottom: 20px;
            }

            .hero h1 {
                color: #5f4633 !important;
                font-weight: bold;
            }

            .hero p {
                color: #5f4633 !important;
            }

        .home-main-btn {
            background-color: #c47f45 !important;
            border: 1px solid #c47f45 !important;
            color: white !important;
        }

            .home-main-btn:hover {
                background-color: #a86635 !important;
                border-color: #a86635 !important;
                color: white !important;
            }

        .home-outline-btn {
            background-color: transparent !important;
            color: #c47f45 !important;
            border: 1px solid #c47f45 !important;
        }

            .home-outline-btn:hover {
                background-color: #c47f45 !important;
                color: white !important;
            }
    </style>
</head>

<body>

    <div class="container">

        <div class="hero">

            <h1 class="display-3">
                Pet Adoption System
            </h1>

            <p class="lead mt-4">
                給毛孩一個溫暖的家
            </p>

            <p class="mb-4">
                提供寵物查詢、領養申請與後台管理功能
            </p>

            <div class="mt-4">

                <a href="/Account/Login"
                   class="btn btn-lg me-2 home-main-btn">
                    登入系統
                </a>

                <a href="/Account/Register"
                   class="btn btn-lg home-outline-btn">
                    會員註冊
                </a>

            </div>

        </div>

    </div>

</body>

</html>
